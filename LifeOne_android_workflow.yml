name: Build LifeOne APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'LifeOneAndroidProject.zip'
      - '.github/workflows/android.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract LifeOne project
        run: unzip -q LifeOneAndroidProject.zip
      - name: Build debug APK
        run: gradle -p LifeOneAndroid --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeOne-debug-apk
          path: LifeOneAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
