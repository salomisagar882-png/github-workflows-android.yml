name: Build LifeOne APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'LifeOneAndroidProject_v1.1.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract LifeOne project
        run: |
          unzip -q LifeOneAndroidProject_v1.1.zip -d extracted
          find extracted -type f -name gradlew -print

      - name: Build debug APK
        run: |
          GRADLEW=$(find extracted -type f -name gradlew -print -quit)
          if [ -z "$GRADLEW" ]; then
            echo 'ERROR: No gradlew found. Check the ZIP contents.'
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          chmod +x "$GRADLEW"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeOne-debug-apk
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
